[tool.poetry]
name = "se-interview"
version = "0.1.0"
description = "A simple LangGraph agent with web search capability"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
langgraph = "^0.2"
langchain = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.2"
ddgs = "^9.0"
python-dotenv = "^1.0"
fastapi = "^0.115"
uvicorn = "^0.32"
arize-phoenix-otel = ">=0.16.0"
openinference-instrumentation-langchain = "^0.1.84"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "arize-phoenix-evals (>=3.10.0,<4.0.0)",
    "arize-phoenix-client (>=3.7.0,<4.0.0)",
    "pandas (>=3.1.1,<4.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
